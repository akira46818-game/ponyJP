<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d63df">
  <title>ポニーランド学園 第1話｜読み聞かせ試作版</title>
  <style>
    :root {
      --ink: #3b2751;
      --muted: #735f83;
      --paper: rgba(255,255,255,.94);
      --pink: #f052a2;
      --violet: #8058d4;
      --gold: #f2b544;
      --aqua: #4aa6db;
      --shadow: 0 22px 60px rgba(75, 39, 100, .22);
      --text-size: 24px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.9), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(255,229,119,.55), transparent 27%),
        linear-gradient(145deg, #f9dff2 0%, #e5e5ff 48%, #d9f4ff 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: .27;
      background-image: radial-gradient(#fff 1.4px, transparent 1.4px);
      background-size: 22px 22px;
    }
    button, select, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { min-height: 100dvh; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
    .topbar {
      width: min(1180px, 100%); margin: 0 auto 10px; display: flex; align-items: center; gap: 10px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.76);
      border: 1px solid rgba(255,255,255,.9); box-shadow: 0 8px 24px rgba(87,60,122,.10);
      border-radius: 999px; padding: 8px 14px; font-weight: 900; letter-spacing: .02em;
    }
    .brand .star { color: var(--gold); font-size: 1.25em; }
    .trial { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 800; background: rgba(255,255,255,.68); padding: 7px 11px; border-radius: 999px; }
    .shell {
      width: min(1180px, 100%); margin: auto; position: relative; background: var(--paper);
      border: 2px solid rgba(255,255,255,.92); border-radius: 30px; box-shadow: var(--shadow);
      overflow: hidden; backdrop-filter: blur(12px);
    }
    .cover-view { min-height: min(760px, calc(100dvh - 86px)); display: grid; grid-template-columns: minmax(280px, .9fr) 1.1fr; }
    .cover-art { background: linear-gradient(145deg, #f8d8ef, #ebe5ff); padding: 26px; display: grid; place-items: center; }
    .cover-art img { max-height: 650px; width: 100%; object-fit: contain; border-radius: 22px; filter: drop-shadow(0 18px 28px rgba(72,39,80,.2)); }
    .cover-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(30px, 6vw, 78px); }
    .eyebrow { color: var(--pink); font-weight: 900; letter-spacing: .08em; margin: 0 0 10px; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 66px); line-height: 1.1; letter-spacing: .01em; }
    .subtitle { margin: 18px 0 0; font-weight: 800; color: var(--violet); font-size: clamp(19px, 2.5vw, 28px); }
    .intro { margin: 24px 0 30px; color: var(--muted); font-size: 17px; line-height: 1.8; }
    .primary {
      border: 0; color: white; font-size: 20px; font-weight: 900; padding: 18px 26px; border-radius: 18px;
      background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 12px 26px rgba(128,88,212,.30);
      cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
    }
    .primary:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(128,88,212,.34); }
    .primary:active { transform: translateY(1px); }
    .hint { margin: 18px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .reader-view { display: none; min-height: min(760px, calc(100dvh - 86px)); grid-template-rows: auto 1fr auto; }
    .reader-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid #eadff0; }
    .icon-btn {
      border: 0; background: #f2eafa; color: var(--violet); border-radius: 14px; min-width: 46px; height: 46px;
      font-weight: 900; cursor: pointer;
    }
    .page-meta { min-width: 0; }
    .page-meta strong { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-meta span { color: var(--muted); font-size: 13px; font-weight: 700; }
    .progress { margin-left: auto; width: min(240px, 28vw); }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 800; margin-bottom: 6px; }
    .track { height: 9px; background: #eee5f4; border-radius: 999px; overflow: hidden; }
    .bar { height: 100%; width: 3%; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: inherit; transition: width .35s ease; }
    .reader-main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(330px, .75fr); min-height: 0; }
    .picture { position: relative; background: linear-gradient(145deg, #eadff8, #dff3ff); min-height: 440px; display: grid; place-items: center; overflow: hidden; }
    .picture::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 80px rgba(80,45,110,.10); pointer-events: none; }
    .picture img { width: 100%; height: 100%; max-height: 620px; object-fit: contain; animation: reveal .5s ease; }
    @keyframes reveal { from { opacity: .3; transform: scale(1.015); } to { opacity: 1; transform: scale(1); } }
    .story-panel { display: flex; flex-direction: column; padding: clamp(24px, 4vw, 48px); min-height: 0; background: rgba(255,255,255,.87); }
    .speaker {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
      color: #76508e; background: #f4eafb; font-size: 13px; font-weight: 900; margin-bottom: 16px;
    }
    .story-title { margin: 0 0 18px; font-size: clamp(25px, 3vw, 38px); line-height: 1.25; }
    .story-text { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: var(--text-size); line-height: 1.95; font-weight: 700; letter-spacing: .025em; white-space: pre-line; overflow: auto; padding-right: 3px; }
    .phrase { border-radius: 7px; transition: background .18s ease, color .18s ease; }
    .phrase.active { background: #fff0a8; color: #4a2d5b; box-shadow: 0 0 0 4px #fff0a8; }
    .reader-controls { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 10px; padding: 14px 18px 18px; border-top: 1px solid #eadff0; }
    .control {
      min-height: 54px; border: 0; border-radius: 17px; padding: 10px 18px; font-weight: 900; cursor: pointer;
      background: #f2eafa; color: var(--violet); transition: transform .12s ease, filter .12s ease;
    }
    .control:hover { filter: brightness(.98); transform: translateY(-1px); }
    .control:active { transform: translateY(1px); }
    .control.main { color: white; background: linear-gradient(135deg, var(--pink), var(--violet)); min-width: 150px; }
    .control.auto.on { color: #4d3610; background: #ffe39a; }
    .control.prev { justify-self: start; }
    .control.next { justify-self: end; }
    .settings {
      display: none; position: absolute; inset: 0; z-index: 20; background: rgba(47,28,62,.45); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .settings.open { display: flex; }
    .settings-card { width: min(500px, 100%); background: white; border-radius: 24px; padding: 26px; box-shadow: var(--shadow); }
    .settings-card h2 { margin: 0 0 22px; }
    .setting-row { display: grid; grid-template-columns: 1fr 1.2fr; gap: 18px; align-items: center; margin: 16px 0; }
    .setting-row label { font-weight: 900; }
    .setting-row select, .setting-row input { width: 100%; }
    .close-settings { width: 100%; margin-top: 14px; }
    .notice { margin: 18px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    @media (max-width: 820px) {
      .app { padding-left: 8px; padding-right: 8px; }
      .cover-view { grid-template-columns: 1fr; }
      .cover-art { padding: 18px; min-height: 42dvh; }
      .cover-art img { max-height: 44dvh; }
      .cover-copy { padding: 26px 24px 34px; }
      .reader-main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 46dvh) auto; }
      .picture { min-height: 260px; }
      .picture img { max-height: 48dvh; }
      .story-panel { padding: 22px; }
      .story-text { max-height: 36dvh; }
      .reader-controls { grid-template-columns: 1fr 1fr 1fr; }
      .control.prev { grid-column: 1; }
      .control.main { grid-column: 2; min-width: 0; }
      .control.next { grid-column: 3; }
      .control.auto { grid-column: 1 / 3; }
      .control.settings-button { grid-column: 3; }
      .progress { width: 100px; }
      .trial { display: none; }
    }
    @media (max-width: 460px) {
      :root { --text-size: 20px; }
      .brand { font-size: 13px; }
      .reader-head { padding: 10px; }
      .page-meta strong { font-size: 15px; }
      .page-meta span { display: none; }
      .progress { width: 84px; }
      .reader-controls { padding: 10px; gap: 7px; }
      .control { min-height: 50px; padding: 8px 10px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand"><span class="star">★</span> ポニーランド学園</div>
      <div class="trial">読み聞かせ・動作試作版</div>
    </div>

    <section class="shell" aria-live="polite">
      <div class="cover-view" id="coverView">
        <div class="cover-art"><img src="embedded/841006059b9bd82f95ab.webp" alt="ポニーランド学園 第1話の表紙"></div>
        <div class="cover-copy">
          <p class="eyebrow">だい1わ</p>
          <h1>ルミナ、<br>魔法学園へ行く</h1>
          <p class="subtitle">絵本の読み聞かせ</p>
          <p class="intro">絵と文章を見ながら、端末の日本語音声で物語を読み上げます。途中からでも、好きな場面からでも楽しめます。</p>
          <button class="primary" id="startButton">▶ 読み聞かせをはじめる</button>
          <p class="hint">音声が聞こえない場合は、端末の音量をご確認ください。専用キャラクター音声は次の制作段階で追加できます。</p>
        </div>
      </div>

      <div class="reader-view" id="readerView">
        <header class="reader-head">
          <button class="icon-btn" id="homeButton" aria-label="表紙へ戻る">⌂</button>
          <div class="page-meta"><strong id="headerTitle"></strong><span>第1話「ルミナ、魔法学園へ行く」</span></div>
          <div class="progress">
            <div class="progress-label"><span id="pageNumber">1 / 33</span><span id="percent">3%</span></div>
            <div class="track"><div class="bar" id="progressBar"></div></div>
          </div>
        </header>

        <div class="reader-main">
          <div class="picture"><img id="sceneImage" alt="物語の場面"></div>
          <article class="story-panel">
            <div class="speaker" id="speakerBadge">♪ ナレーター</div>
            <h2 class="story-title" id="storyTitle"></h2>
            <div class="story-text" id="storyText"></div>
          </article>
        </div>

        <footer class="reader-controls">
          <button class="control prev" id="prevButton">← まえ</button>
          <button class="control main" id="speakButton">▶ よんで</button>
          <button class="control next" id="nextButton">つぎ →</button>
          <button class="control auto" id="autoButton">∞ 自動：オフ</button>
          <button class="control settings-button" id="settingsButton">⚙ せってい</button>
        </footer>
      </div>

      <div class="settings" id="settingsDialog" role="dialog" aria-modal="true" aria-label="読み聞かせ設定">
        <div class="settings-card">
          <h2>読み聞かせの設定</h2>
          <div class="setting-row">
            <label for="speedSelect">読む速さ</label>
            <select id="speedSelect"><option value="0.78">ゆっくり</option><option value="0.9" selected>ふつう</option><option value="1.03">少し速い</option></select>
          </div>
          <div class="setting-row">
            <label for="sizeRange">文字の大きさ</label>
            <input type="range" id="sizeRange" min="18" max="34" value="24">
          </div>
          <p class="notice">この試作版では、端末に入っている日本語音声を使います。ルミナ・フレア・ミュウミュウは、声の高さと速さを変えて読み分けます。</p>
          <button class="primary close-settings" id="closeSettings">この設定でつづける</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const scenes = [{"title":"にじの先のポニーランド","text":"むかしむかし――と いっても、\nそんなに むかしでは ありません。\nにじを 七つ こえた その先に、\nキラキラ ふしぎな 国が ありました。\nその名は、ポニーランド。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/773ffd21b3c68cfdd4b0.webp"},{"title":"はじめての入学式","text":"国の まんなかには、\nおしろみたいな 魔法学園（まほうがくえん）。\n今日は、まちに まった 入学式です。\nカーン、カーン！\n朝の かねが、空まで はずみました。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/773ffd21b3c68cfdd4b0.webp"},{"title":"すやすやルミナ","text":"ジリリリリ！　ジリリリリ！\n目ざまし時計が、何度 よんでも――\nルミナは ふわふわの ふとんの中。\n「ん～……あと、にじ 一本……」\nでも 時計を 見た とたん、目が パチン！","speaker":"narrator","speakerName":"ナレーター","image":"embedded/976c464c07dc2effe3a7.webp"},{"title":"ねぼうした！","text":"「たいへーーーん！　ねぼうしたー！」\n朝から、大きな声が ひびきました。\nピンク色の 小さなポニーが、\n二階から ドタドタドタッ！\n金色の たてがみが、朝日の リボンみたい。\n名前は、ルミナ。元気いっぱいの 女の子です。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/9d2b252d1c546b22326d.webp"},{"title":"しゅっぱつ！","text":"今日は、ずっと 楽しみにしていた 初日。\nなのに 時計の はりは、どんどん 先へ！\nルミナは パンを くわえ、\nかばんを ひょいっと 背中に のせました。\n「行ってきまーす！」\nげんかんへ、ピューン！","speaker":"narrator","speakerName":"ナレーター","image":"embedded/353ccb39dbf1aae9e377.webp"},{"title":"お母さんの声","text":"「行ってきまーす！」\nげんかんを ピューンと とび出した ルミナ。\n一歩、二歩、三歩。足は 前へ 前へ！\n朝の 光に、むねも わくわく。\nそのとき、後ろから お母さんの声。\n「ルミナ！」――ルミナは、くるん！","speaker":"mother","speakerName":"ルミナのお母さん","image":"embedded/18de5705d52b8db9ef76.webp"},{"title":"教科書をわすれた！","text":"「なあに？」　「教科書！」\n「あっ！」\nかばんの 中は、からっぽです。\nはねかえった ボールみたいに、くるん！\n金色の たてがみも、くるり。\nルミナは 風より はやく 逆もどり！","speaker":"mother","speakerName":"ルミナのお母さん","image":"embedded/0ea56e8e6062ad507c3a.webp"},{"title":"おべんとうも！","text":"教科書を つめて、二度め。\n「今度こそ、行ってきまーす！」\n「ルミナ、おべんとう！」\n「ああああーっ！」\nふりむいた ひょうしに、パンが ぽろり。\nお母さんも、とうとう ふきだしました。","speaker":"mother","speakerName":"ルミナのお母さん","image":"embedded/081b741fb7460aa5e583.webp"},{"title":"今度こそ、いってきます","text":"ようやく、ぜんぶ そろいました。\nお母さんは かばんの ベルトを なおし、\n背中を ぽん、と やさしく おしました。\n「あわてても、前は ちゃんと 見るのよ」\n「はーい！　今度こそ、本当に――\n行ってきまーす！」","speaker":"mother","speakerName":"ルミナのお母さん","image":"embedded/ecf21b9ed5576c0c6ab9.webp"},{"title":"花の道をダッシュ","text":"タッタッタッタッ！\nルミナは、朝の 野原を 走ります。\nひづめの 音は、小さな たいこ。\n金色の たてがみは、光の ながい リボン。\n風まで「はやく、はやく！」と、\n耳もとで おうえんして くれました。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/b8a75270a3510e1609b1.webp"},{"title":"夢への第一歩","text":"ルミナの ゆめは、\n世界で 一番 はやい ポニーに なること。\n「もっと はやく！　もっと、もっと！」\n一歩 けるたび、むねの おくで、\nわくわくが ポン、ポン、はねました。\n今日は、ゆめへの はじめの 一歩です。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/6739108b906ed963ef61.webp"},{"title":"小さな声","text":"そのときです。\n「……ピヨ。ピヨ……」\n風よりも 小さな 声が しました。\nルミナの 耳が、ぴくん。\n走っていた 足も、ぴたり。\n「だれか、ないてる？」","speaker":"narrator","speakerName":"ナレーター","image":"embedded/766c61820578e1857534.webp"},{"title":"あぶない！","text":"道の まんなかに、\n小さな 小鳥の 赤ちゃんが いました。\n「あっ、あぶない！」\nキキキキーッ！\n土けむりが ふわりと 晴れると、\nルミナの 鼻と、小さなくちばしが こんにちは。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/26e0662b59d075992ba4.webp"},{"title":"二つの心","text":"ルミナは 時計を 見ました。\n入学式まで、もう ほんの 少し。\n「おくれちゃう……」\nけれど 小鳥は、ぷるぷる ふるえています。\n急ぎたい 心と、助けたい 心が、\nつなひきみたいに ぎゅうっと 引っぱりました。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/f92af188367e8d14fa90.webp"},{"title":"ひとりにしないよ","text":"ルミナは、小鳥と 同じ 高さに しゃがみました。\n「びっくりさせて、ごめんね」\n「お母さんと はぐれたの？」\n小鳥は、こくん。\n「だいじょうぶ。ひとりに しないよ。\nいっしょに おうちを さがそう！」","speaker":"lumina","speakerName":"ルミナ","image":"embedded/8e799f33797a647bdc85.webp"},{"title":"小鳥のおうちは？","text":"「おうちは、どこかな？」\nルミナが 木の上を 見まわすと――\nゆら、ゆら、ゆら。\nひくい えだに、空っぽの 巣（す）が 一つ。\n黄色い はねも、ひらり。\n「あそこだ！　きっと あの巣だよ！」","speaker":"lumina","speakerName":"ルミナ","image":"embedded/39a353e388a770eadd69.webp"},{"title":"巣へジャンプ","text":"ルミナは 小鳥を 背中に のせました。\n「しっかり つかまってね」\n大きな 石へ、よいしょ。\n木の ねもとへ、もう 一歩。\nルミナが そっと 体を のばすと、\n小鳥は ぴょん！ と 巣へ もどれました。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/f74af13aaad4e9d191a0.webp"},{"title":"お母さんどり","text":"「ピヨー！」\n空から、お母さんどりが とんできました。\n「ピヨピヨ！」\n小鳥は、つばさの中へ すっぽり。\nルミナの 心も、おひさまみたいに ぽかぽか。\n「よかった！　もう はぐれないでね」","speaker":"lumina","speakerName":"ルミナ","image":"embedded/c2fe9f451ea26cb6622a.webp"},{"title":"もう時間がない！","text":"ルミナは、もう 一度 時計を 見ました。\n目が まんまる。口も まんまる。\n「……たいへーーーん！」\nタタタタタッ！\n鳥の 親子が「がんばって！」と、\n空から ついてきて くれました。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/b23ef9f81cad39c0a548.webp"},{"title":"魔法学園が見えた","text":"坂を かけ上がった その先に――\nなないろに かがやく 大きな おしろ！\nとうは 雲を くすぐり、\nまどは 宝石みたいに キラキラ。\n「わあ……！\nここが、ポニーランド魔法学園！」","speaker":"lumina","speakerName":"ルミナ","image":"embedded/4414c9813fe35e81abbe.webp"},{"title":"ふしぎな学園","text":"本が、魚みたいに 空を すいすい。\n大きな 花が「おはよう」と おじぎ。\n雲の うんどう場では、ボールが ぽんぽん！\nルミナの 目は、星より キラキラです。\n「あっ、見とれてる ばあいじゃ なかった！」\n三びょうだけ わすれて、また ダッシュ！","speaker":"narrator","speakerName":"ナレーター","image":"embedded/1f06450025d693615bdd.webp"},{"title":"ドカーン！","text":"そのとき――\nドカーン！\n校門（こうもん）の むこうから、\nまんまるの 炎と、白い けむりが もくもく！\n「けほっ、けほっ。な、なに？」\nルミナの 顔は、すすで まっくろです。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/6b009889b2cbcde85da1.webp"},{"title":"炎の女の子","text":"けむりが、すうっと わかれました。\nそこに 立っていたのは、\n炎みたいな たてがみの 女の子。\n足もとで、小さな 火が メラメラ。\n「もう！　また 大きく なりすぎた！」\n女の子は、くやしそうに ほっぺを ぷう。","speaker":"flare","speakerName":"フレア","image":"embedded/e2bc9f419e254beb9732.webp"},{"title":"きれいな炎","text":"「今の 炎、あなたが 出したの？」\n女の子は、怒られると 思って 目を そらします。\n「……そうだけど。なによ」\n「すごーい！　あったかくて、きれい！」\n思いがけない ことばに、女の子の かたが ふわり。\n小さな 火も、ほたるみたいに おどりました。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/979b72a91928c1028a19.webp"},{"title":"はじめまして、フレア","text":"「わたし、ルミナ！　よろしくね！」\n「……フレアよ」\n「よろしく、フレアちゃん！」\n「“ちゃん”は いらない」\n「わかった、フレアちゃん！」\n「わかってない！」――でも 二人は、ぷっと 笑いました。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/3d2cccbb23f94bda6185.webp"},{"title":"かけっこ勝負","text":"フレアは、むねを はりました。\n「この学園で 一番に なるのは、わたしよ。\n魔法も、べんきょうも――かけっこも！」\nルミナの 耳が、ピクッ！\n「かけっこなら、わたしも まけないよ！」\n鼻を つきあわせ、二人は にっこり。","speaker":"flare","speakerName":"フレア","image":"embedded/ea42a22a10fce7c4e8fb.webp"},{"title":"入学式のかね","text":"カーン！　カーン！　カーン！\n入学式の かねが 鳴りました。\nルミナと フレアの えがおが、ぴたり。\n校門が、ギギギ……と しまりはじめます。\n「入学式、わすれてたー！」\n二人の 声が、空で ぴったんこ！","speaker":"narrator","speakerName":"ナレーター","image":"embedded/16ea02bb57eef7277d03.webp"},{"title":"門まで競走","text":"「よーい、ドン！」も 言わないまま、\n二人は いっせいに 走りだしました。\n校門まで、あと 十メートル。五メートル。\n「まけないよ！」　「こっちの せりふ！」\n赤と 金の たてがみが、二本の 光になって、\nぐんぐん 門へ 近づきます。","speaker":"lumina","speakerName":"ルミナ","image":"embedded/16ea02bb57eef7277d03.webp"},{"title":"ミュウミュウが！","text":"あと 三メートル――そのとき！\n門の まんなかに、黒い 小さな かげ。\n赤い スカーフの 子ねこが、\nのんびり 前足を ペロペロしています。\n「ねこちゃん！」　「あぶない！」\nキキキキキーーーッ！","speaker":"narrator","speakerName":"ナレーター","image":"embedded/b04c311f6e2e998b8c6a.webp"},{"title":"花だんへポフン","text":"ゴツン！　くるくるくる――ポフン！\n二人は、なかよく 花だんへ。\n花びらが、紙ふぶきみたいに ひらひらひら。\n「いたたた……」　「もう！　何なのよ！」\n子ねこは まゆ一つ うごかさず、\nまだ 前足を ペロペロしていました。","speaker":"narrator","speakerName":"ナレーター","image":"embedded/b5e6e4e4807b921d6f51.webp"},{"title":"しゃべる子ねこ","text":"「ねこちゃん、そこは あぶないよ」\n「ねこちゃんじゃ ないにゃ。\nぼくは、ミュウミュウだにゃ！」\n「ねこが しゃべったーーー！」\n「ここは 魔法学園だにゃ」\n「それも そうか！」「なっとく、早すぎ！」","speaker":"mewmew","speakerName":"ミュウミュウ","image":"embedded/b04c311f6e2e998b8c6a.webp"},{"title":"なぜ名前を？","text":"ミュウミュウは、ルミナを じっと 見ました。\nさっきまでの おどけた 目が、まっすぐに なります。\n「やっと 来たにゃ……ルミナ」\n「えっ？　どうして、わたしの 名前を？」\nそのとき、一番 高い とうから、\nなないろの 光が、空へ のびました。","speaker":"mewmew","speakerName":"ミュウミュウ","image":"embedded/d1be2b79b9972a520a83.webp"},{"title":"101のとびら","text":"「とくべつな 力を もつ、\n100人の ポニーの 物語が はじまるにゃ」\n三人が 校しゃへ 走りだした、その ずっと 下。\n学園の ちかで、『101』の とびらが そっと 開き、\nなないろの 光が、細く こぼれました。\n大きな ぼうけんは、もう はじまっています。","speaker":"mewmew","speakerName":"ミュウミュウ","image":"embedded/9ace918fd3c534a28054.webp"}];
    const profiles = {
      narrator: { rate: 0.90, pitch: 1.00 },
      lumina: { rate: 0.98, pitch: 1.24 },
      flare: { rate: 0.94, pitch: 1.08 },
      mother: { rate: 0.86, pitch: 1.02 },
      mewmew: { rate: 0.92, pitch: 1.34 },
    };

    const coverView = document.getElementById('coverView');
    const readerView = document.getElementById('readerView');
    const sceneImage = document.getElementById('sceneImage');
    const storyTitle = document.getElementById('storyTitle');
    const storyText = document.getElementById('storyText');
    const headerTitle = document.getElementById('headerTitle');
    const speakerBadge = document.getElementById('speakerBadge');
    const pageNumber = document.getElementById('pageNumber');
    const percent = document.getElementById('percent');
    const progressBar = document.getElementById('progressBar');
    const speakButton = document.getElementById('speakButton');
    const autoButton = document.getElementById('autoButton');
    const speedSelect = document.getElementById('speedSelect');
    const sizeRange = document.getElementById('sizeRange');
    const settingsDialog = document.getElementById('settingsDialog');

    let page = Math.max(0, Math.min(scenes.length - 1, Number(localStorage.getItem('ponyland-read-page') || 0)));
    let speaking = false;
    let autoPlay = false;
    let speechToken = 0;
    let voices = [];

    function refreshVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
    refreshVoices();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshVoices;

    function phrases(text) {
      return text
        .replace(/\n+/g, ' ')
        .split(/(?<=[。！？！])/u)
        .map((part) => part.trim())
        .filter(Boolean);
    }

    function renderText(scene) {
      storyText.replaceChildren();
      phrases(scene.text).forEach((phrase, index) => {
        const span = document.createElement('span');
        span.className = 'phrase';
        span.dataset.index = String(index);
        span.textContent = phrase + (index < phrases(scene.text).length - 1 ? ' ' : '');
        storyText.appendChild(span);
      });
    }

    function render() {
      stopSpeech(false);
      const scene = scenes[page];
      sceneImage.src = scene.image;
      sceneImage.alt = scene.title;
      storyTitle.textContent = scene.title;
      headerTitle.textContent = scene.title;
      speakerBadge.textContent = '♪ ' + scene.speakerName;
      renderText(scene);
      const progress = Math.round(((page + 1) / scenes.length) * 100);
      pageNumber.textContent = (page + 1) + ' / ' + scenes.length;
      percent.textContent = progress + '%';
      progressBar.style.width = progress + '%';
      document.getElementById('prevButton').disabled = page === 0;
      document.getElementById('nextButton').textContent = page === scenes.length - 1 ? 'おわり ✓' : 'つぎ →';
      localStorage.setItem('ponyland-read-page', String(page));
      storyText.scrollTop = 0;
    }

    function getJapaneseVoice() {
      return voices.find((voice) => voice.lang === 'ja-JP') || voices.find((voice) => voice.lang.startsWith('ja')) || null;
    }

    function markPhrase(index) {
      storyText.querySelectorAll('.phrase').forEach((node, i) => node.classList.toggle('active', i === index));
      const active = storyText.querySelector('.phrase.active');
      if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function speakScene() {
      if (!('speechSynthesis' in window)) {
        alert('この端末では自動読み上げを利用できません。文章を見ながらお楽しみください。');
        return;
      }
      stopSpeech(false);
      const token = ++speechToken;
      const scene = scenes[page];
      const parts = phrases(scene.text);
      const profile = profiles[scene.speaker] || profiles.narrator;
      const speed = Number(speedSelect.value || 0.9);
      const voice = getJapaneseVoice();
      speaking = true;
      speakButton.textContent = '■ とめる';

      const speakPart = (index) => {
        if (token !== speechToken || !speaking) return;
        if (index >= parts.length) {
          speaking = false;
          speakButton.textContent = '↻ もう一度';
          markPhrase(-1);
          if (autoPlay && page < scenes.length - 1) {
            setTimeout(() => { if (autoPlay) { page += 1; render(); speakScene(); } }, 900);
          } else if (autoPlay && page === scenes.length - 1) {
            autoPlay = false;
            updateAutoButton();
          }
          return;
        }
        markPhrase(index);
        const utterance = new SpeechSynthesisUtterance(parts[index]);
        utterance.lang = 'ja-JP';
        utterance.rate = Math.max(0.5, Math.min(1.4, speed * (profile.rate / 0.9)));
        utterance.pitch = profile.pitch;
        if (voice) utterance.voice = voice;
        utterance.onend = () => speakPart(index + 1);
        utterance.onerror = () => {
          speaking = false;
          speakButton.textContent = '▶ よんで';
          markPhrase(-1);
        };
        speechSynthesis.speak(utterance);
      };
      speakPart(0);
    }

    function stopSpeech(resetLabel = true) {
      speechToken += 1;
      speaking = false;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      markPhrase(-1);
      if (resetLabel) speakButton.textContent = '▶ よんで';
    }

    function updateAutoButton() {
      autoButton.classList.toggle('on', autoPlay);
      autoButton.textContent = autoPlay ? '∞ 自動：オン' : '∞ 自動：オフ';
    }

    function startReader() {
      coverView.style.display = 'none';
      readerView.style.display = 'grid';
      render();
      speakScene();
    }

    document.getElementById('startButton').addEventListener('click', startReader);
    document.getElementById('homeButton').addEventListener('click', () => {
      stopSpeech(); autoPlay = false; updateAutoButton();
      readerView.style.display = 'none'; coverView.style.display = 'grid';
    });
    document.getElementById('prevButton').addEventListener('click', () => { if (page > 0) { page -= 1; render(); } });
    document.getElementById('nextButton').addEventListener('click', () => {
      if (page < scenes.length - 1) { page += 1; render(); }
      else { stopSpeech(); readerView.style.display = 'none'; coverView.style.display = 'grid'; }
    });
    speakButton.addEventListener('click', () => speaking ? stopSpeech() : speakScene());
    autoButton.addEventListener('click', () => {
      autoPlay = !autoPlay; updateAutoButton();
      if (autoPlay && !speaking) speakScene();
    });
    document.getElementById('settingsButton').addEventListener('click', () => settingsDialog.classList.add('open'));
    document.getElementById('closeSettings').addEventListener('click', () => settingsDialog.classList.remove('open'));
    settingsDialog.addEventListener('click', (event) => { if (event.target === settingsDialog) settingsDialog.classList.remove('open'); });
    sizeRange.addEventListener('input', () => document.documentElement.style.setProperty('--text-size', sizeRange.value + 'px'));
    document.addEventListener('keydown', (event) => {
      if (readerView.style.display !== 'grid') return;
      if (event.key === 'ArrowRight' && page < scenes.length - 1) { page += 1; render(); }
      if (event.key === 'ArrowLeft' && page > 0) { page -= 1; render(); }
      if (event.key === ' ') { event.preventDefault(); speaking ? stopSpeech() : speakScene(); }
    });
  </script>
