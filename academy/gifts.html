<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16122e"><title>ミュウミュウの銀河ガチャ｜ポニーランド学園</title><link rel="stylesheet" href="gifts.css?v=1"><script src="market-gifts.js?v=1" defer></script><script src="gifts.js?v=1" defer></script></head>
<body><main class="gift-shell">
  <nav><a href="./">← 学園に戻る</a><a href="../">ゲーム広場 ↗</a></nav>
  <header><p class="eyebrow">PONYLAND ACADEMY · FREE CLEAR GIFT</p><h1>ミュウミュウの<br><em>銀河ガチャ</em></h1><p>お店をがんばった きみへ。<br>星のカプセルから、なかまがやってくるよ。</p></header>
  <div class="ticket-count" id="ticketCount">ガチャ券を確認しています…</div>
  <section class="gacha-scene" id="scene" aria-label="ミュウミュウと星のカプセル">
    <div class="orbit" aria-hidden="true"></div><div class="stars" id="stars" aria-hidden="true"></div>
    <img class="mewmew" src="mewmew-happy-v8-front.png" alt="ガチャを回してプレゼントする猫のミュウミュウ" width="180" height="220">
    <div class="machine" aria-hidden="true"><div class="globe"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="handle">✦</div><div class="slot"></div></div>
    <div class="capsule" aria-hidden="true"><span>✦</span></div><div class="glow" aria-hidden="true"></div>
  </section>
  <p id="status" class="status" role="status">一日の目標を達成すると、ガチャ券が1枚もらえるよ。</p>
  <button id="turn" class="primary" disabled>ミュウミュウ、まわして！ ↻</button>
  <section id="result" class="result" hidden aria-labelledby="resultTitle">
    <div class="rarity" id="rarity"></div><h2 id="resultTitle" tabindex="-1">なかまが来てくれたよ！</h2>
    <img id="cardImage" class="reward-card" alt=""><a id="download" class="primary" download>カード画像を保存 ↓</a>
    <button id="next" class="secondary" hidden>次のガチャ券を使う</button>
  </section>
  <p class="note">無料のクリア特典です。お金はかかりません。<br>ガチャ券とカードは、このブラウザに保存されます。</p>
  <section class="collection" aria-labelledby="collectionTitle"><h2 id="collectionTitle">この端末のコレクション</h2><p id="collectionEmpty">集めたカードがここに並ぶよ。</p><div id="collection"></div></section>
  <footer><a href="./">🏪 ミニマートへ戻る</a> · <a href="ice-cream/">🍦 アイス屋さんへ</a><button id="backup" class="text-button">お店とカードのバックアップを保存</button><span id="backupStatus" role="status"></span></footer>
</main></body></html>
